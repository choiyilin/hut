<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUT — Find Your Perfect Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --gold: #c9a96e;
        --white: #ffffff;
        --cream: #f0e9dc;
        --nav-h: 76px;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #080808;
        -webkit-font-smoothing: antialiased;
      }

      /* ─────────────── VIDEO STAGE ─────────────── */
      .video-stage {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      .video-stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 1s ease-in-out;
      }

      #vid-a {
        opacity: 1;
        z-index: 1;
      }
      #vid-b {
        opacity: 0;
        z-index: 2;
      }

      /* ─────────────── OVERLAY ─────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 3;
        background:
          radial-gradient(
            ellipse 110% 90% at 50% 44%,
            rgba(0, 0, 0, 0.1) 0%,
            rgba(0, 0, 0, 0.52) 100%
          ),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.28) 100%);
        pointer-events: none;
      }

      /* ─────────────── NAV ─────────────── */
      header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 40;
        height: var(--nav-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 52px;
        background: rgba(6, 6, 6, 0.12);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }

      /* Logo */
      .logo {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 27px;
        letter-spacing: 0.18em;
        color: var(--white);
        text-decoration: none;
        text-transform: uppercase;
        flex-shrink: 0;
      }

      .logo-mark {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
        position: relative;
        top: -5px;
        margin-left: 1px;
      }

      /* Nav links */
      nav ul {
        display: flex;
        align-items: center;
        gap: 4px;
        list-style: none;
      }

      nav ul a {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 15px;
        border-radius: 6px;
        font-family: "DM Sans", sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        letter-spacing: 0.025em;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition:
          color 0.2s ease,
          background 0.2s ease;
      }

      nav ul a i {
        font-size: 9px;
        opacity: 0.55;
        transition:
          opacity 0.2s,
          transform 0.25s;
      }

      nav ul a:hover {
        color: var(--white);
        background: rgba(255, 255, 255, 0.08);
      }

      nav ul a:hover i {
        opacity: 1;
        transform: rotate(45deg);
      }

      /* Auth pill */
      .btn-auth {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 22px;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: var(--white);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.025em;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.25s ease,
          border-color 0.25s ease;
        white-space: nowrap;
      }

      .btn-auth i {
        font-size: 11px;
        opacity: 0.75;
      }

      .btn-auth:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* Mobile hamburger */
      .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 4px;
      }

      .hamburger span {
        display: block;
        width: 22px;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 2px;
      }

      /* ─────────────── HERO ─────────────── */
      .hero {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--nav-h) 24px 0;
      }

      .hero-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-family: "DM Sans", sans-serif;
        font-size: 10.5px;
        font-weight: 400;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 26px;
        opacity: 0;
        animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      .hero-eyebrow::before,
      .hero-eyebrow::after {
        content: "";
        display: block;
        width: 32px;
        height: 1px;
        background: var(--gold);
        opacity: 0.55;
      }

      .hero-h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(44px, 7.8vw, 94px);
        font-weight: 400;
        line-height: 1.07;
        letter-spacing: -0.01em;
        color: var(--white);
        margin-bottom: 50px;
        max-width: 860px;
        opacity: 0;
        animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
      }

      /* ─────────────── SEARCH ─────────────── */
      .search-wrap {
        width: 100%;
        max-width: 680px;
        opacity: 0;
        animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;
      }

      .search-pill {
        display: flex;
        align-items: center;
        height: 62px;
        background: rgba(255, 255, 255, 0.91);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 50px;
        padding: 0 8px 0 30px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.24),
          0 6px 18px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
        transition: box-shadow 0.3s ease;
      }

      .search-pill:focus-within {
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.32),
          0 6px 18px rgba(0, 0, 0, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.85),
          0 0 0 3px rgba(201, 169, 110, 0.45);
      }

      .search-pill input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        outline: none;
        font-family: "DM Sans", sans-serif;
        font-size: 14.5px;
        font-weight: 400;
        color: #1a1a1a;
        letter-spacing: 0.01em;
      }

      .search-pill input::placeholder {
        color: #9a9a9a;
      }

      .search-btn {
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #111111;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        font-size: 14px;
        transition:
          background 0.25s ease,
          transform 0.2s ease;
      }

      .search-btn:hover {
        background: var(--gold);
        transform: scale(1.07);
      }

      /* ─────────────── SCROLL INDICATOR ─────────────── */
      .scroll-cue {
        position: fixed;
        bottom: 38px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        animation: riseIn 1s ease 1.1s both;
      }

      .scroll-cue span {
        font-family: "DM Sans", sans-serif;
        font-size: 9.5px;
        font-weight: 400;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }

      .scroll-line {
        width: 1px;
        height: 40px;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.42) 0%, transparent 100%);
        animation: lineBreath 2.6s ease-in-out infinite;
      }

      @keyframes lineBreath {
        0%,
        100% {
          opacity: 0.35;
          transform: scaleY(0.75) translateY(-6px);
        }
        55% {
          opacity: 0.8;
          transform: scaleY(1) translateY(0px);
        }
      }

      /* ─────────────── ANIMATIONS ─────────────── */
      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ─────────────── RESPONSIVE ─────────────── */
      @media (max-width: 880px) {
        header {
          padding: 0 28px;
        }
        nav {
          display: none;
        }
        .hamburger {
          display: flex;
        }
      }

      @media (max-width: 600px) {
        :root {
          --nav-h: 62px;
        }
        header {
          padding: 0 20px;
        }
        .logo {
          font-size: 22px;
          letter-spacing: 0.14em;
        }
        .btn-auth {
          padding: 8px 16px;
          font-size: 12px;
        }
        .hero-eyebrow {
          font-size: 9px;
          letter-spacing: 0.25em;
          margin-bottom: 20px;
        }
        .hero-eyebrow::before,
        .hero-eyebrow::after {
          width: 20px;
        }
        .hero-h1 {
          margin-bottom: 36px;
        }
        .search-pill {
          height: 54px;
          padding: 0 6px 0 22px;
        }
        .search-pill input {
          font-size: 13px;
        }
        .search-btn {
          width: 42px;
          height: 42px;
          font-size: 13px;
        }
        .scroll-cue {
          bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ─── VIDEO BACKGROUND ─── -->
    <div class="video-stage">
      <video id="vid-a" autoplay muted playsinline webkit-playsinline></video>
      <video id="vid-b" muted playsinline webkit-playsinline></video>
    </div>

    <!-- ─── DARK OVERLAY ─── -->
    <div class="overlay" role="presentation"></div>

    <!-- ─── NAVIGATION ─── -->
    <header>
      <a href="/" class="logo">HUT</a>

      <nav aria-label="Main navigation">
        <ul>
          <li>
            <a href="#">Rent <i class="fa-solid fa-plus"></i></a>
          </li>
          <li>
            <a href="#">Buy <i class="fa-solid fa-plus"></i></a>
          </li>
          <li>
            <a href="#">List <i class="fa-solid fa-plus"></i></a>
          </li>
          <li><a href="#">Agents</a></li>
          <li>
            <a href="#">Featured <i class="fa-solid fa-plus"></i></a>
          </li>
        </ul>
      </nav>

      <div style="display: flex; align-items: center; gap: 14px">
        <a href="#" class="btn-auth">
          <i class="fa-regular fa-user"></i>
          Login&thinsp;/&thinsp;Sign up
        </a>
        <button class="hamburger" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- ─── HERO ─── -->
    <main class="hero">
      <h1 class="hero-h1">Find your perfect Hut</h1>

      <div class="search-wrap" role="search">
        <div class="search-pill">
          <input
            type="text"
            placeholder="Search a neighborhood, address, zip code, borough…"
            aria-label="Search properties"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="search-btn" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
    </main>

    <!-- ─── VIDEO CROSSFADE LOGIC ─── -->
    <script>
      const VIDEOS = ["videos/bg-1.mp4", "videos/bg-2.mp4", "videos/bg-3.mp4"]

      let idx = 0
      const vidA = document.getElementById("vid-a")
      const vidB = document.getElementById("vid-b")
      let active = vidA // currently visible
      let standby = vidB // hidden / preloading

      function boot() {
        active.src = VIDEOS[idx]
        active.load()
        active.play().catch(() => {})

        // Preload the next video in the standby element
        standby.src = VIDEOS[(idx + 1) % VIDEOS.length]
        standby.load()

        attachEndListener()
      }

      function attachEndListener() {
        active.addEventListener("ended", onVideoEnd, { once: true })
      }

      function onVideoEnd() {
        idx = (idx + 1) % VIDEOS.length
        const preloadIdx = (idx + 1) % VIDEOS.length

        // Elevate standby above active for the fade-in
        standby.style.zIndex = "2"
        active.style.zIndex = "1"

        // Start playing standby (already preloaded) and crossfade
        standby.play().catch(() => {})
        standby.style.opacity = "1"
        active.style.opacity = "0"

        // After the 1s CSS transition settles, swap roles
        setTimeout(() => {
          ;[active, standby] = [standby, active]

          // Queue up the video after next into the new standby
          standby.src = VIDEOS[preloadIdx]
          standby.load()

          attachEndListener()
        }, 1150)
      }

      boot()
    </script>
  </body>
</html>
